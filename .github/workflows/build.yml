name: build
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"; SM="$SDK/cmdline-tools/latest/bin/sdkmanager"; [ -x "$SM" ] || SM=$(find "$SDK" -name sdkmanager -type f 2>/dev/null | head -1); yes | "$SM" --licenses >/dev/null 2>&1 || true; "$SM" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
      - name: list repo files
        run: find . -path ./.git -prune -o -type f -print | sort
      - name: fix gradle files
        run: |
          rm -f build.gradle.kts
          cat > settings.gradle.kts << 'EOF'
          pluginManagement {
            repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
            repositories { google(); mavenCentral() }
          }
          include(":app")
          EOF
          cat > app/build.gradle.kts << 'EOF'
          plugins {
            id("com.android.application") version "8.5.2"
            id("org.jetbrains.kotlin.android") version "1.9.24"
          }
          android {
            namespace = "com.quest.adbterm"
            compileSdk = 34
            ndkVersion = "26.1.10909125"
            defaultConfig {
              applicationId = "com.quest.adbterm"
              minSdk = 26
              targetSdk = 28
              versionCode = 1
              versionName = "1.0"
              ndk { abiFilters += "arm64-v8a" }
            }
            externalNativeBuild {
              cmake {
                path = file("src/main/cpp/CMakeLists.txt")
                version = "3.22.1"
              }
            }
          }
          EOF
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: apk
          path: app/build/outputs/apk/**/*.apk
      - uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v${{ github.run_number }}
          files: app/build/outputs/apk/**/*.apk
