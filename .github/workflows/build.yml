name: build
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: sdk
        run: SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"; SM="$SDK/cmdline-tools/latest/bin/sdkmanager"; [ -x "$SM" ] || SM=$(find "$SDK" -name sdkmanager -type f 2>/dev/null | head -1); yes | "$SM" --licenses >/dev/null 2>&1 || true; "$SM" "platforms;android-34" "build-tools;34.0.0"
      - name: write gradle files
        run: |
          rm -f build.gradle.kts
          printf '%s\n' 'pluginManagement {' '  repositories { google(); mavenCentral(); gradlePluginPortal() }' '}' 'dependencyResolutionManagement {' '  repositories { google(); mavenCentral() }' '}' 'include(":app")' > settings.gradle.kts
          printf '%s\n' 'plugins {' '  id("com.android.application") version "8.5.2"' '  id("org.jetbrains.kotlin.android") version "1.9.24"' '}' 'android {' '  namespace = "com.quest.adbterm"' '  compileSdk = 34' '  defaultConfig {' '    applicationId = "com.quest.adbterm"' '    minSdk = 26' '    targetSdk = 28' '    versionCode = 1' '    versionName = "1.0"' '  }' '  compileOptions {' '    sourceCompatibility = JavaVersion.VERSION_17' '    targetCompatibility = JavaVersion.VERSION_17' '  }' '  kotlinOptions {' '    jvmTarget = "17"' '  }' '}' > app/build.gradle.kts
      - name: write manifest
        run: |
          mkdir -p app/src/main/res/values
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<resources>' '    <string name="app_name">Quest ADB Terminal</string>' '</resources>' > app/src/main/res/values/strings.xml
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<manifest xmlns:android="http://schemas.android.com/apk/res/android">' '    <uses-permission android:name="android.permission.INTERNET" />' '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' '    <uses-permission android:name="android.permission.WAKE_LOCK" />' '    <uses-feature android:name="android.hardware.touchscreen" android:required="false" />' '    <application android:label="@string/app_name" android:icon="@android:drawable/sym_def_app_icon" android:allowBackup="false" android:hardwareAccelerated="true" android:usesCleartextTraffic="true" android:theme="@android:style/Theme.Material.NoActionBar">' '        <activity android:name=".MainActivity" android:exported="true" android:resizeableActivity="true" android:launchMode="singleTask" android:screenOrientation="landscape" android:configChanges="orientation|screenSize|screenLayout|keyboardHidden|density|uiMode|navigation">' '            <intent-filter>' '                <action android:name="android.intent.action.MAIN" />' '                <category android:name="android.intent.category.LAUNCHER" />' '                <category android:name="com.oculus.intent.category.2D" />' '                <category android:name="com.oculus.intent.category.PANEL" />' '            </intent-filter>' '        </activity>' '    </application>' '</manifest>' > app/src/main/AndroidManifest.xml
      - name: write kotlin
        run: |
          mkdir -p app/src/main/java/com/quest/adbterm
          rm -f app/src/main/java/com/quest/adbterm/MainActivity.kt
          printf '%s\n' 'package com.quest.adbterm' '' 'import android.app.Activity' 'import android.graphics.Color' 'import android.graphics.Typeface' 'import android.os.Bundle' 'import android.os.Handler' 'import android.os.Looper' 'import android.text.InputType' 'import android.text.SpannableStringBuilder' 'import android.text.Spanned' 'import android.text.style.ForegroundColorSpan' 'import android.view.View' 'import android.view.WindowManager' 'import android.view.inputmethod.EditorInfo' 'import android.widget.Button' 'import android.widget.EditText' 'import android.widget.LinearLayout' 'import android.widget.ScrollView' 'import android.widget.TextView' 'import java.io.File' 'import java.io.FileOutputStream' 'import java.io.OutputStream' 'import java.net.HttpURLConnection' 'import java.net.URL' 'import java.util.zip.ZipInputStream' '' 'class MainActivity : Activity() {' '' '  private val bg = 0xFF05070A.toInt()' '  private val fg = 0xFF58F58B.toInt()' '  private val dim = 0xFF2E9B5F.toInt()' '  private val info = 0xFF7FD4FF.toInt()' '  private val warn = 0xFFFFC857.toInt()' '  private val err = 0xFFFF6B6B.toInt()' '  private val panel = 0xFF0B1014.toInt()' '  private val mono = Typeface.MONOSPACE' '' '  private class P(val t: String, val c: Int?)' '' '  private val q = ArrayDeque<P>()' '  private var sched = false' '  private val h = Handler(Looper.getMainLooper())' '  private val buf = SpannableStringBuilder()' '' '  private lateinit var logv: TextView' '  private lateinit var input: EditText' '  private lateinit var scroll: ScrollView' '' '  private var proc: Process? = null' '  private var stdin: OutputStream? = null' '' '  override fun onCreate(s: Bundle?) {' '    super.onCreate(s)' '    window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)' '    ui()' '    emit("Quest ADB Terminal\non-device arm64 adb - 127.0.0.1\n\n", info)' '    boot()' '  }' '' '  override fun onDestroy() {' '    if (isFinishing) { proc?.destroy(); proc = null }' '    super.onDestroy()' '  }' '' '  private fun ui() {' '    val root = LinearLayout(this)' '    root.orientation = LinearLayout.VERTICAL' '    root.setBackgroundColor(bg)' '    root.setPadding(30, 30, 30, 30)' '' '    val t = TextView(this)' '    t.text = "QUEST ADB TERMINAL"' '    t.setTextColor(fg)' '    t.typeface = mono' '    t.textSize = 18f' '    root.addView(t)' '' '    val s = TextView(this)' '    s.text = "on-device arm64 adb - 127.0.0.1 - standalone"' '    s.setTextColor(dim)' '    s.typeface = mono' '    s.textSize = 12f' '    root.addView(s)' '' '    scroll = ScrollView(this)' '    scroll.setBackgroundColor(Color.BLACK)' '    scroll.isFillViewport = true' '    logv = TextView(this)' '    logv.typeface = mono' '    logv.textSize = 13f' '    logv.setTextColor(fg)' '    logv.setPadding(20, 20, 20, 20)' '    logv.setTextIsSelectable(true)' '    scroll.addView(logv)' '    root.addView(scroll, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f))' '' '    val row = LinearLayout(this)' '    row.orientation = LinearLayout.HORIZONTAL' '    input = EditText(this)' '    input.hint = "adb devices"' '    input.setTextColor(fg)' '    input.setHintTextColor(dim)' '    input.setBackgroundColor(panel)' '    input.typeface = mono' '    input.textSize = 14f' '    input.setSingleLine(true)' '    input.inputType = InputType.TYPE_CLASS_TEXT' '    input.imeOptions = EditorInfo.IME_ACTION_SEND' '    input.setOnEditorActionListener { _, a, _ ->' '      if (a == EditorInfo.IME_ACTION_SEND || a == EditorInfo.IME_NULL) { go(); true } else false' '    }' '    row.addView(input, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))' '    row.addView(mk("SEND") { go() })' '    root.addView(row)' '' '    root.addView(btnrow("PAIR" to { pre("adb pair localhost:") }, "CONNECT" to { pre("adb connect localhost:") }, "DEVICES" to { send("adb devices -l") }))' '    root.addView(btnrow("SHELL" to { pre("adb shell ") }, "DISCONNECT" to { send("adb disconnect") }, "KILL" to { send("adb kill-server") }))' '    root.addView(btnrow("CLEAR" to { buf.clear(); logv.text = "" }, "ADB" to { pre("adb ") }, "HELP" to { help() }))' '' '    setContentView(root)' '  }' '' '  private fun mk(label: String, f: () -> Unit): Button {' '    val b = Button(this)' '    b.text = label' '    b.typeface = mono' '    b.textSize = 12f' '    b.isAllCaps = false' '    b.setTextColor(fg)' '    b.setBackgroundColor(panel)' '    b.minimumWidth = 0' '    b.setPadding(8, 8, 8, 8)' '    b.setOnClickListener { f() }' '    return b' '  }' '' '  private fun btnrow(vararg ps: Pair<String, () -> Unit>): LinearLayout {' '    val r = LinearLayout(this)' '    r.orientation = LinearLayout.HORIZONTAL' '    for (p in ps) r.addView(mk(p.first, p.second), LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))' '    return r' '  }' '' '  private fun emit(t: String, c: Int? = null) {' '    synchronized(q) {' '      q.addLast(P(t, c))' '      if (sched) return' '      sched = true' '    }' '    h.postDelayed({ drain() }, 40)' '  }' '' '  private fun drain() {' '    val items: List<P>' '    synchronized(q) {' '      if (q.isEmpty()) { sched = false; return }' '      items = q.toList()' '      q.clear()' '      sched = false' '    }' '    for (p in items) {' '      val st = buf.length' '      buf.append(p.t)' '      if (p.c != null) buf.setSpan(ForegroundColorSpan(p.c), st, buf.length, Spanned.SPAN_EXCLUSIVE_EXCLUSIVE)' '    }' '    if (buf.length > 40000) buf.delete(0, buf.length - 40000)' '    logv.text = buf' '    scroll.post { scroll.fullScroll(View.FOCUS_DOWN) }' '  }' '' '  private fun pre(p: String) {' '    input.setText(p)' '    input.setSelection(p.length)' '    input.requestFocus()' '  }' '' '  private fun go() {' '    val c = input.text.toString().trim()' '    if (c.length == 0) return' '    input.setText("")' '    send(c)' '  }' '' '  private fun send(cmd: String) {' '    val s = stdin' '    if (s == null) { emit("[!] shell not ready\n", warn); return }' '    emit("\n> " + cmd + "\n", info)' '    try {' '      s.write((cmd.trimEnd() + "\n").toByteArray(Charsets.UTF_8))' '      s.flush()' '    } catch (e: Throwable) {' '      emit("[!] write failed: " + e.message + "\n", err)' '    }' '  }' '' '  private fun boot() {' '    Thread {' '      try {' '        emit("[boot] preparing adb...\n", info)' '        val adb = ensureAdb()' '        emit("[tools] using " + adb.absolutePath + "\n", info)' '        startShell(adb.parentFile!!)' '        help()' '        send("adb version")' '        send("adb devices")' '      } catch (t: Throwable) {' '        emit("\n[boot failed] " + t.javaClass.simpleName + ": " + t.message + "\n", err)' '        emit("First launch needs internet - it downloads adb from github.\n", err)' '      }' '    }.start()' '  }' '' '  private fun ensureAdb(): File {' '    val root = File(filesDir, "tools")' '    root.mkdirs()' '    val old = findAdb(root)' '    if (old != null && old.length() > 0) {' '      old.setExecutable(true, false)' '      emit("[tools] adb already present (" + old.length() + " bytes) exec=" + old.canExecute() + "\n", info)' '      return old' '    }' '    val zip = File(root, "tools.zip")' '    emit("[tools] downloading android-sdk-tools-static-aarch64.zip\n", info)' '    val u = URL("https://github.com/lzhiyong/android-sdk-tools/releases/download/33.0.3/android-sdk-tools-static-aarch64.zip")' '    val c = u.openConnection() as HttpURLConnection' '    c.instanceFollowRedirects = true' '    c.connectTimeout = 20000' '    c.readTimeout = 60000' '    c.connect()' '    val code = c.responseCode' '    if (code < 200 || code > 299) throw RuntimeException("http " + code)' '    med("")' '    c.inputStream.use { ins ->' '      FileOutputStream(zip).use { out ->' '        val b = ByteArray(65536)' '        var total = 0L' '        var mark = 0L' '        while (true) {' '          val n = ins.read(b)' '          if (n <= 0) break' '          out.write(b, 0, n)' '          total += n' '          if (total - mark >= 5242880) { mark = total; emit("[tools] " + (total / 1048576) + " MB\n", dim) }' '        }' '      }' '    }' '    c.disconnect()' '    emit("[tools] extracting...\n", info)' '    unzip(zip, root)' '    zip.delete()' '    val adb = findAdb(root) ?: throw RuntimeException("no adb in archive")' '    adb.setExecutable(true, false)' '    emit("[tools] exec bit = " + adb.canExecute() + "\n", info)' '    if (!adb.canExecute()) emit("[tools] WARNING: could not set executable\n", warn)' '    return adb' '  }' '' '  private fun med(x: String) {' '    if (x.length > 0) emit(x + "\n", dim)' '  }' '' '  private fun unzip(z: File, dest: File) {' '    val dp = dest.canonicalPath' '    ZipInputStream(z.inputStream().buffered()).use { zis ->' '      while (true) {' '        val e = zis.nextEntry ?: break' '        val t = File(dest, e.name)' '        if (!t.canonicalPath.startsWith(dp + File.separator)) { zis.closeEntry(); continue }' '        if (e.isDirectory) {' '          t.mkdirs()' '        } else {' '          t.parentFile?.mkdirs()' '          FileOutputStream(t).use { o -> zis.copyTo(o, 65536) }' '        }' '        zis.closeEntry()' '      }' '    }' '  }' '' '  private fun findAdb(d: File): File? {' '    val kids = d.listFiles() ?: return null' '    for (f in kids) if (f.isFile && f.name == "adb") return f' '    for (f in kids) if (f.isDirectory) { val r = findAdb(f); if (r != null) return r }' '    return null' '  }' '' '  private fun startShell(tools: File) {' '    val home = File(filesDir, "home")' '    home.mkdirs()' '    val tmp = File(cacheDir, "tmp")' '    tmp.mkdirs()' '    val pb = ProcessBuilder("/system/bin/sh")' '    pb.directory(home)' '    pb.redirectErrorStream(true)' '    val env = pb.environment()' '    env["PATH"] = tools.absolutePath + ":/system/bin:/system/xbin"' '    env["HOME"] = home.absolutePath' '    env["TMPDIR"] = tmp.absolutePath' '    env["TERM"] = "dumb"' '    env["ANDROID_ADB_SERVER_PORT"] = "5037"' '    val p = pb.start()' '    proc = p' '    stdin = p.outputStream' '    emit("[boot] shell up - PATH=" + tools.absolutePath + "\n", info)' '    Thread {' '      val b = ByteArray(4096)' '      val ins = p.inputStream' '      try {' '        while (true) {' '          val n = ins.read(b)' '          if (n <= 0) break' '          emit(String(b, 0, n, Charsets.UTF_8).replace("\r\n", "\n").replace("\r", "\n"))' '        }' '      } catch (e: Throwable) {' '      }' '      emit("\n[shell] closed\n", warn)' '    }.start()' '  }' '' '  private fun help() {' '    emit("\nWIRELESS DEBUGGING - HOW TO CONNECT\n", info)' '    emit("1. Settings > System > Developer > Wireless debugging  -> ON\n", dim)' '    emit("2. Tap: Pair device with pairing code\n", dim)' '    emit("   Note the host:port AND the 6 digit code. Keep that open.\n", dim)' '    emit("3. Tap PAIR, finish to: adb pair localhost:PORT   then SEND\n", dim)' '    emit("4. When asked, type the 6 digit code and press SEND\n", dim)' '    emit("   Success: Successfully paired to localhost:PORT\n", dim)' '    emit("5. Back on Wireless debugging, note IP address and Port\n", dim)' '    emit("   That is a DIFFERENT port than the pairing one.\n", dim)' '    emit("6. Tap CONNECT, finish to: adb connect localhost:PORT  SEND\n", dim)' '    emit("   Success: connected to localhost:PORT\n", dim)' '    emit("7. Tap DEVICES - your headset should list as: device\n", dim)' '    emit("8. Tap SHELL then: adb shell ls /sdcard\n", dim)' '    emit("Pairing is done once. After a reboot, turn debugging back on\n", dim)' '    emit("and repeat step 6.\n\n", dim)' '  }' '}' > app/src/main/java/com/quest/adbterm/MainActivity.kt
          wc -l app/src/main/java/com/quest/adbterm/MainActivity.kt
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle :app:assembleDebug --no-daemon
      - run: cp app/build/outputs/apk/debug/app-debug.apk app-debug.apk
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: apk
          path: app-debug.apk
      - uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v${{ github.run_number }}
          files: app-debug.apk
