name: build
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: sdk
        run: SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"; SM="$SDK/cmdline-tools/latest/bin/sdkmanager"; [ -x "$SM" ] || SM=$(find "$SDK" -name sdkmanager -type f 2>/dev/null | head -1); yes | "$SM" --licenses >/dev/null 2>&1 || true; "$SM" "platforms;android-34" "build-tools;34.0.0"
      - name: write gradle files
        run: |
          rm -f build.gradle.kts
          printf '%s\n' 'pluginManagement {' '  repositories { google(); mavenCentral(); gradlePluginPortal() }' '}' 'dependencyResolutionManagement {' '  repositories { google(); mavenCentral() }' '}' 'include(":app")' > settings.gradle.kts
          printf '%s\n' 'plugins {' '  id("com.android.application") version "8.5.2"' '  id("org.jetbrains.kotlin.android") version "1.9.24"' '}' 'android {' '  namespace = "com.quest.adbterm"' '  compileSdk = 34' '  defaultConfig {' '    applicationId = "com.quest.adbterm"' '    minSdk = 26' '    targetSdk = 28' '    versionCode = 1' '    versionName = "1.0"' '  }' '  compileOptions {' '    sourceCompatibility = JavaVersion.VERSION_17' '    targetCompatibility = JavaVersion.VERSION_17' '  }' '  kotlinOptions {' '    jvmTarget = "17"' '  }' '}' > app/build.gradle.kts
      - name: write manifest
        run: |
          mkdir -p app/src/main/res/values
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<resources>' '    <string name="app_name">Quest ADB Terminal</string>' '</resources>' > app/src/main/res/values/strings.xml
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<manifest xmlns:android="http://schemas.android.com/apk/res/android">' '    <uses-permission android:name="android.permission.INTERNET" />' '    <uses-feature android:name="android.hardware.touchscreen" android:required="false" />' '    <application android:label="@string/app_name" android:icon="@android:drawable/sym_def_app_icon" android:allowBackup="false" android:hardwareAccelerated="true" android:theme="@android:style/Theme.Material.NoActionBar">' '        <activity android:name=".MainActivity" android:exported="true" android:resizeableActivity="true" android:launchMode="singleTask" android:screenOrientation="landscape" android:configChanges="orientation|screenSize|screenLayout|keyboardHidden|density|uiMode|navigation">' '            <intent-filter>' '                <action android:name="android.intent.action.MAIN" />' '                <category android:name="android.intent.category.LAUNCHER" />' '                <category android:name="com.oculus.intent.category.2D" />' '                <category android:name="com.oculus.intent.category.PANEL" />' '            </intent-filter>' '        </activity>' '    </application>' '</manifest>' > app/src/main/AndroidManifest.xml
      - name: write kotlin
        run: |
          mkdir -p app/src/main/java/com/quest/adbterm
          printf '%s\n' 'package com.quest.adbterm' '' 'import android.app.Activity' 'import android.graphics.Color' 'import android.graphics.Typeface' 'import android.os.Bundle' 'import android.text.InputType' 'import android.view.WindowManager' 'import android.widget.Button' 'import android.widget.EditText' 'import android.widget.LinearLayout' 'import android.widget.ScrollView' 'import android.widget.TextView' 'import java.text.SimpleDateFormat' 'import java.util.Date' 'import java.util.Locale' '' 'class MainActivity : Activity() {' '' '  private lateinit var logView: TextView' '  private lateinit var input: EditText' '' '  override fun onCreate(savedInstanceState: Bundle?) {' '    super.onCreate(savedInstanceState)' '    window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)' '' '    val root = LinearLayout(this)' '    root.orientation = LinearLayout.VERTICAL' '    root.setBackgroundColor(0xFF05070A.toInt())' '    root.setPadding(40, 40, 40, 40)' '' '    val title = TextView(this)' '    title.text = "QUEST ADB TERMINAL"' '    title.setTextColor(0xFF58F58B.toInt())' '    title.typeface = Typeface.MONOSPACE' '    title.textSize = 18f' '    root.addView(title)' '' '    val sub = TextView(this)' '    sub.text = "UI test build"' '    sub.setTextColor(0xFF2E9B5F.toInt())' '    sub.typeface = Typeface.MONOSPACE' '    sub.textSize = 12f' '    root.addView(sub)' '' '    val scroll = ScrollView(this)' '    scroll.setBackgroundColor(Color.BLACK)' '    logView = TextView(this)' '    logView.typeface = Typeface.MONOSPACE' '    logView.textSize = 14f' '    logView.setTextColor(0xFF58F58B.toInt())' '    logView.setPadding(20, 20, 20, 20)' '    scroll.addView(logView)' '    root.addView(scroll, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f))' '' '    val row = LinearLayout(this)' '    row.orientation = LinearLayout.HORIZONTAL' '    input = EditText(this)' '    input.hint = "type here"' '    input.setTextColor(0xFF58F58B.toInt())' '    input.setHintTextColor(0xFF2E9B5F.toInt())' '    input.setBackgroundColor(0xFF0B1014.toInt())' '    input.typeface = Typeface.MONOSPACE' '    input.textSize = 14f' '    input.inputType = InputType.TYPE_CLASS_TEXT' '    row.addView(input, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))' '' '    val send = Button(this)' '    send.text = "SEND"' '    send.setTextColor(0xFF58F58B.toInt())' '    send.setBackgroundColor(0xFF0B1014.toInt())' '    send.setOnClickListener { onSend() }' '    row.addView(send)' '    root.addView(row)' '' '    setContentView(root)' '' '    log("UI is rendering. If you can read this, the app opened.\n")' '    log("Tap SEND - it should echo what you typed.\n")' '    log("Time: " + SimpleDateFormat("HH:mm:ss", Locale.US).format(Date()) + "\n")' '  }' '' '  private fun onSend() {' '    val t = input.text.toString()' '    input.setText("")' '    log("> " + t + "\n")' '  }' '' '  private fun log(s: String) {' '    logView.append(s)' '  }' '}' > app/src/main/java/com/quest/adbterm/MainActivity.kt
          wc -l app/src/main/java/com/quest/adbterm/MainActivity.kt
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle :app:assembleDebug --no-daemon
      - run: cp app/build/outputs/apk/debug/app-debug.apk app-debug.apk
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: apk
          path: app-debug.apk
      - uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v${{ github.run_number }}
          files: app-debug.apk
